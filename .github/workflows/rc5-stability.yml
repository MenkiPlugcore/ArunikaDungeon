name: RC5 Stability verified build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - patches/rc5-stability.py
      - .github/workflows/rc5-stability.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify RC3 baseline and apply patches
        run: |
          echo 'd3fd3eacfa681c74b7ce8d959b0ace8ffc6bc7a50d9f10eb931abb719061cbdb  ArunikaDungeon-v1.0.0-RC3-source.zip' | sha256sum -c -
          unzip -q ArunikaDungeon-v1.0.0-RC3-source.zip -d source
          python3 patches/rc3-yaml-fix.py source/ArunikaDungeon-v1.0.0-RC3
          python3 patches/rc4-waystone.py source/ArunikaDungeon-v1.0.0-RC3
          python3 patches/rc5-stability.py source/ArunikaDungeon-v1.0.0-RC3
          mv source/ArunikaDungeon-v1.0.0-RC3 source/ArunikaDungeon-v1.0.0-RC5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: source/ArunikaDungeon-v1.0.0-RC5/pom.xml
      - name: Compile and verify
        working-directory: source/ArunikaDungeon-v1.0.0-RC5
        run: bash tools/build-verified.sh
      - name: Upload verified staging JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArunikaDungeon-1.0.0-RC5-Stability-staging
          path: source/ArunikaDungeon-v1.0.0-RC5/target/verified/
          if-no-files-found: error
      - name: Archive exact patched source
        working-directory: source
        run: zip -qr ArunikaDungeon-v1.0.0-RC5-source.zip ArunikaDungeon-v1.0.0-RC5 -x '*/target/*' '*/build-logs/*'
      - uses: actions/upload-artifact@v4
        with:
          name: RC5-patched-source
          path: source/ArunikaDungeon-v1.0.0-RC5-source.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC5-build-diagnostics
          path: source/ArunikaDungeon-v1.0.0-RC5/build-logs/
          if-no-files-found: warn
