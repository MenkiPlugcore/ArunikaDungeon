schema-version: 2
# Foundation release is intentionally read-only from the player's perspective.
# Gameplay remains disabled in code; this is not an activation switch.
foundation-only: true
battle-preview: false
shared-preview: false
private-preview: false
loot-preview: false
battle-tick-interval: 5
scheduler:
  interval-ticks: 20
sessions:
  max-private-players: 5
  max-private-active: 3
  shared-cooldown-seconds: 1800
  reservation-timeout-seconds: 60

migration:
  backup-retention: 5
